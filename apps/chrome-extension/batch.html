<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>批量擷取 Gemini 對話</title>
<link rel="stylesheet" href="batch.css">
</head>
<body>
<main>
  <h1>批量擷取 Gemini 對話</h1>
  <p class="lead">把 Gemini 側邊欄裡的對話一段段打開、擷取，上傳到你私人倉庫的 <code>inbox/</code>。
    抓過的會記在 <code>inbox/index.jsonl</code>，下次只抓新的。</p>

  <section class="card">
    <h2>1. 倉庫</h2>
    <p id="repo-status" class="muted">檢查 GitHub 設定中…</p>
    <button id="open-options" class="secondary" hidden>打開 GitHub 設定</button>
  </section>

  <section class="card">
    <h2>2. 讀取對話清單</h2>
    <p class="muted">會開一個 Gemini 視窗，自動捲完側邊欄，讀出所有對話的標題。</p>
    <button id="list" disabled>讀取 Gemini 對話清單</button>
    <p id="list-status" class="muted" role="status"></p>
    <div id="list-result" hidden>
      <p id="summary"></p>
      <details open>
        <summary>對話清單（灰色的是抓過的；可以取消勾選不想抓的）</summary>
        <div class="tools">
          <button id="select-new" class="link">只勾選未擷取的</button>
          <button id="select-none" class="link">全部取消</button>
        </div>
        <ol id="chats"></ol>
      </details>
    </div>
  </section>

  <section class="card">
    <h2>3. 開始擷取</h2>
    <p class="muted">擷取時請讓 Gemini 那個視窗留在畫面上（不要縮到最小），也不要關掉這一頁。你可以去做別的事。</p>
    <div class="pair">
      <button id="start" disabled>開始擷取</button>
      <button id="stop" class="secondary" disabled>做完這一段後停止</button>
    </div>
    <div id="progress" hidden>
      <div class="bar"><span id="bar-fill"></span></div>
      <p id="progress-text"></p>
      <p id="current" class="muted"></p>
    </div>
    <div id="done" hidden>
      <p id="done-text"></p>
      <ol id="failures"></ol>
      <button id="retry" class="secondary" hidden>重試失敗的</button>
      <button id="open-inbox" class="secondary">在 GitHub 上查看 inbox/</button>
    </div>
  </section>
</main>
<script src="github.js"></script>
<script src="capture.js"></script>
<script src="guide.js"></script>
<script src="batch.js"></script>
</body>
</html>
